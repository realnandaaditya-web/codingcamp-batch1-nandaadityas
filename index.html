<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>Daily Planner
        </h1>

        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Add a task..." required>
            <input type="date" id="date-input" required>
        </form>

        <div class="controls">
            <select id="filter-todo">
                <option value="all">Completed</option>
                <option value="completed">Uncompleted</option>
                <option value="uncompleted">Pending</option>
            </select>
            <button type="submit" form="todo-form" id="add-btn">Submit</button>
            <button id="delete-all">Delete All</button>


        </div>

        <table>
            <thead>
                <tr>
                    <th>Task</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="todo-list">
            </tbody>
        </table>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
